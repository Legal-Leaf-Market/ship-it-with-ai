<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request sent | Ship It With AI</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;background:#16182B;color:#F6F3EC;font-family:'Inter',Arial,sans-serif;overflow:hidden;position:relative}
.orb{position:absolute;right:-160px;top:-120px;width:480px;aspect-ratio:1;border-radius:50%;background:#FF6B4A}
.wrap{position:relative;max-width:720px;margin:0 auto;padding:48px 24px}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#FF6B4A;margin:0 0 18px}
h1{font-family:'Space Grotesk',Arial,sans-serif;font-size:clamp(52px,10vw,104px);letter-spacing:-3px;line-height:1;margin:0}
p{font-size:20px;line-height:1.55;color:#C9CCDA;margin:28px 0 0}
a{display:inline-block;margin-top:36px;font-family:'Space Grotesk',Arial,sans-serif;font-weight:700;font-size:18px;color:#16182B;background:#FF6B4A;padding:16px 28px;border-radius:999px;text-decoration:none}
</style>
</head>
<body>
<div class="orb" aria-hidden="true"></div>
<div class="wrap">
  <p class="eyebrow">Request sent</p>
  <h1>Got it. Thank you.</h1>
  <p>Your booking request is in. I'll read it myself and get back to you by email with dates and a price.</p>
  <a href="/">Back to the site</a>
</div>
</body>
</html>
